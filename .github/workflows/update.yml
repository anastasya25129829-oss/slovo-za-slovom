name: Обновление даты

on:
  schedule:
    # GitHub считает время по UTC. Екатеринбург = UTC+5.
    # 19:07 UTC = 00:07 в Екатеринбурге: сразу после смены суток.
    # 01:07 UTC = 06:07 в Екатеринбурге: запасной запуск, если ночной пропущен.
    # Минуты :07 — потому что в начале часа GitHub загружен сильнее всего.
    - cron: "7 19 * * *"
    - cron: "7 1 * * *"
  workflow_dispatch: # кнопка ручного запуска

permissions:
  contents: write # нужно, чтобы сохранить data.json в репозиторий

concurrency:
  group: update-data # два запуска сразу не идут
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest # для открытых репозиториев бесплатно
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Записать сегодняшнюю дату
        run: python3 fetch.py

      - name: Сохранить data.json
        run: |
          git add data.json
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновление даты"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
